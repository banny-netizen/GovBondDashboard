name: probe

# 새 출처의 응답 모양을 확인할 때만 쓴다.
# probe/ 로 시작하는 브랜치에 probe_urls.txt 를 올리면 돈다. 허용 목록 밖 주소는 호출되지 않는다.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 응답 확인
        run: python3 scripts/probe.py
